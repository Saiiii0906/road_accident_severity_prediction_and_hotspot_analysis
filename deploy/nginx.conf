# =================================================================
# Vantage Reverse Proxy Configuration via Nginx
# NOTE: Replace 'api.vantage.example.com' with your verified domain
# before requesting Let's Encrypt / Certbot SSL certificates.
# =================================================================
server {
    listen 80;
    server_name api.vantage.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vantage.example.com;

    ssl_certificate /etc/letsencrypt/live/api.vantage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vantage.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;
    proxy_read_timeout 90s;
    proxy_connect_timeout 15s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
