# =================================================================
# Vantage Reverse Proxy Configuration via Nginx
# NOTE: Replace 'api.vantage.example.com' with your verified domain
# before requesting Let's Encrypt / Certbot SSL certificates.
# =================================================================
# Rate Limiting Zones (defense against automated request floods and abuse)
limit_req_zone $binary_remote_addr zone=vantage_api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=vantage_heavy_limit:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name api.vantage.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.vantage.example.com;

    ssl_certificate /etc/letsencrypt/live/api.vantage.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vantage.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    client_max_body_size 5M;
    proxy_read_timeout 90s;
    proxy_connect_timeout 15s;

    # Stricter rate limits for Gemini synthesis and multi-provider journey queries
    location ~* ^/(api/)?(journey/analyze|reports/ai-infrastructure-report) {
        limit_req zone=vantage_heavy_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standard rate limits for all other API endpoints and healthchecks
    location / {
        limit_req zone=vantage_api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
